org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# JVM 编译编码固定为 UTF-8（源码与资源含中文）
android.enableJetifier=false

# ============================================================
# 本机构建代理（如需，请放在 ~/.gradle/gradle.properties 或个人配置里）
#
# 不要把本机代理写进这里并提交——CI 环境（GitHub Actions 等）
# 没有这个代理，会导致所有依赖下载失败。
# 如确实需要代理，在用户级 ~/.gradle/gradle.properties 中配置：
#
#   systemProp.http.proxyHost=127.0.0.1
#   systemProp.http.proxyPort=7899
#   systemProp.https.proxyHost=127.0.0.1
#   systemProp.https.proxyPort=7899
# ============================================================
