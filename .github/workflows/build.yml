name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建 APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 赋予 gradlew 可执行权限
        run: chmod +x ./gradlew

      - name: 执行构建
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: 输出构建信息
        run: |
          {
            echo "### 构建产物（多架构）"
            echo ""
            echo "| 文件 | 大小 |"
            echo "|---|---|"
            for f in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
              [ -e "$f" ] || continue
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
            done
          } >> $GITHUB_STEP_SUMMARY

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OpenTV-debug-apks
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: 上传 Release APK（多架构，未签名）
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OpenTV-release-apks-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30
