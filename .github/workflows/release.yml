name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建并发布的版本标签（如 v1.5.2）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 赋予 gradlew 可执行权限
        run: chmod +x ./gradlew

      - name: 构建 Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: 整理产物
        id: pkg
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          OUT="OpenTV-Player-${VERSION}-release-unsigned.apk"
          cp "$APK" "$OUT"
          echo "apk=$OUT" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "版本: $VERSION"
          echo "产物: $OUT"
          ls -lh "$OUT"

      - name: 计算校验和
        id: hash
        run: |
          SHA=$(sha256sum "${{ steps.pkg.outputs.apk }}" | awk '{print $1}')
          echo "sha256=$SHA" >> $GITHUB_OUTPUT
          echo "SHA256: $SHA"

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: OpenTV Player ${{ steps.pkg.outputs.version }}
          files: ${{ steps.pkg.outputs.apk }}
          generate_release_notes: true
          body: |
            > ⚠️ 此包由 CI 自动构建，**未签名**（未配置签名密钥），
            > 无法直接覆盖安装到已安装正式版的设备。
            > 正式分发的签名包请见带 `-release.apk` 字样的附件。

            **SHA-256**：`${{ steps.hash.outputs.sha256 }}`

            本应用只提供播放器能力，不附带任何频道源；使用何种内容源由使用者自行决定并自负合规责任。
