name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建并发布的版本标签（如 v1.5.2）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: 构建并发布（多架构 + 签名）
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 赋予 gradlew 可执行权限
        run: chmod +x ./gradlew

      - name: 恢复签名密钥库
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > opentv-release.jks
            {
              echo "storeFile=opentv-release.jks"
              echo "storePassword=${KEYSTORE_PASSWORD}"
              echo "keyAlias=${KEY_ALIAS}"
              echo "keyPassword=${KEY_PASSWORD}"
            } > keystore.properties
            echo "::notice::签名密钥库已就绪，本次构建将产出【已签名】APK"
          else
            echo "::warning::未配置签名 Secrets，本次构建产出【未签名】APK"
          fi

      - name: 构建 Release APK（按 ABI 拆分 + 通用包）
        run: ./gradlew assembleRelease --stacktrace

      - name: 整理产物并算校验和
        id: pkg
        run: |
          set -e
          SRC=app/build/outputs/apk/release
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "版本: $VERSION"

          # 是否签名（依据 keystore.properties 是否存在）
          if [ -f keystore.properties ]; then
            SIGNED="signed"
            echo "::notice::产物为已签名包"
          else
            SIGNED="unsigned"
          fi
          echo "signed=$SIGNED" >> $GITHUB_OUTPUT

          echo "=== 原始产物 ==="
          ls -lh "$SRC"

          mkdir -p dist
          for f in "$SRC"/*.apk; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            case "$base" in
              *universal*)    tag="universal" ;;
              *armeabi-v7a*)  tag="armeabi-v7a" ;;
              *arm64-v8a*)    tag="arm64-v8a" ;;
              *x86_64*)       tag="x86_64" ;;
              *x86*)          tag="x86" ;;
              *)              tag="unknown" ;;
            esac
            cp "$f" "dist/OpenTV-Player-${VERSION}-${tag}.apk"
            echo "  $base  ->  OpenTV-Player-${VERSION}-${tag}.apk"
          done

          cd dist
          sha256sum *.apk > SHA256SUMS.txt
          echo "=== 待发布文件 ==="
          ls -lh
          cat SHA256SUMS.txt

      - name: 校验签名
        if: steps.pkg.outputs.signed == 'signed'
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          echo "apksigner: $APKSIGNER"
          for f in dist/*.apk; do
            echo "--- $(basename "$f") ---"
            "$APKSIGNER" verify --print-certs "$f" | head -3
          done

      - name: 输出构建摘要
        run: |
          {
            echo "## 构建产物（多架构 · ${{ steps.pkg.outputs.signed }}）"
            echo ""
            echo "| 文件 | 大小 |"
            echo "|---|---|"
            for f in dist/*.apk; do
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
            done
            echo ""
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: 上传构建产物（Actions artifact）
        uses: actions/upload-artifact@v4
        with:
          name: OpenTV-release-apks-${{ steps.pkg.outputs.signed }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: OpenTV Player ${{ steps.pkg.outputs.version }}
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## 按设备架构下载

            > ℹ️ 当前版本未包含原生库（.so），各架构包内容一致，任选其一即可。
            > 拆分框架已就位：后续版本引入原生库后，各包将自动只含对应架构的库。
            > **不确定选哪个就下 `universal`**。

            | 文件名 | 适用设备 |
            |---|---|
            | `OpenTV-Player-${{ steps.pkg.outputs.version }}-arm64-v8a.apk` | 主流新设备（2016 年后手机 / 电视盒子） |
            | `OpenTV-Player-${{ steps.pkg.outputs.version }}-armeabi-v7a.apk` | 较老的 32 位设备 |
            | `OpenTV-Player-${{ steps.pkg.outputs.version }}-x86_64.apk` | x86 架构平板 / 模拟器 |
            | `OpenTV-Player-${{ steps.pkg.outputs.version }}-x86.apk` | 老 x86 设备 / 模拟器 |
            | `OpenTV-Player-${{ steps.pkg.outputs.version }}-universal.apk` | **全架构通用兜底包** |

            均为 CI 自动构建，签名状态：**${{ steps.pkg.outputs.signed }}**。

            ## 校验和

            详见附件 `SHA256SUMS.txt`。

            本应用只提供播放器能力，不附带任何频道源；使用何种内容源由使用者自行决定并自负合规责任。
